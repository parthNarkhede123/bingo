name: Keep backend warm

# Render's free web service sleeps after ~15 min idle and cold-starts (~50s) on
# the next request. This pings the health endpoint every 13 minutes so real
# players rarely hit a cold start. Free. Adjust or delete once on a paid plan.
#
# Note: GitHub disables scheduled workflows after 60 days with no repo activity,
# and may delay cron runs under load. Override the URL with a repo variable
# named BACKEND_URL if your Render URL differs from the default.

on:
  schedule:
    - cron: '*/13 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="${{ vars.BACKEND_URL || 'https://bingo-arena-api.onrender.com' }}/api/health"
          echo "Pinging $URL"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$URL" || echo "000")
          echo "HTTP $code"
          # Don't fail the workflow on a cold-start timeout; the ping itself wakes it.
          if [ "$code" = "200" ]; then echo "awake"; else echo "warming (non-200 is ok)"; fi

# Render Blueprint for PG Manager.
#
# In the Render dashboard: New + > Blueprint > connect this repo. Because the
# service name below is NEW, Render provisions a FRESH service — the old
# bingo-arena / bingo-arena-api services are untouched and keep running until
# you delete them in the dashboard. You will need to (re)enter any secrets for
# this new service there.
#
# Public URL is derived from the service name (Render appends a suffix if the
# name is already taken globally):
#   https://pg-manager.onrender.com

services:
  - type: web
    runtime: node
    name: pg-manager
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
